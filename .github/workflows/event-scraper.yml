name: Event scraper

on:
  workflow_dispatch:

concurrency:
  group: event-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: jobs/event-scraper
    env:
      PARBIN_API_URL: ${{ secrets.PARBIN_API_URL }}
      # Headless must stay on. GitHub-hosted runners have no display.
      SCRAPER_HEADLESS: "true"
      SCRAPER_TIMEOUT_MS: ${{ vars.SCRAPER_TIMEOUT_MS || '45000' }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: jobs/event-scraper/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Require scraper configuration
        run: |
          if [ -z "$PARBIN_API_URL" ]; then
            echo "Set the PARBIN_API_URL repository secret (Settings → Secrets and variables → Actions → Secrets)."
            exit 1
          fi

      - name: Run scraper
        run: pnpm start
