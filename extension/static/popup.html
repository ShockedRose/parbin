<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parbin Event Suggester</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="icons/icon-32.png" alt="" width="20" height="20" />
        <span>Parbin</span>
        <span id="site-badge" class="badge" hidden></span>
      </div>
      <button id="settings-toggle" class="icon-button" type="button" title="Backend settings" aria-expanded="false" aria-controls="settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2.5h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.67 8.98a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.04.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z" />
        </svg>
      </button>
    </header>

    <section id="settings" class="panel" hidden>
      <form id="settings-form" class="stack" novalidate>
        <label class="field">
          <span>Parbin backend URL</span>
          <input id="api-base-url" type="url" placeholder="http://localhost:8080" required />
        </label>
        <div class="row">
          <button type="submit" class="button">Save &amp; test</button>
          <span id="settings-status" class="hint" role="status"></span>
        </div>
      </form>
    </section>

    <main>
      <div id="status" class="notice" role="status">Reading this page…</div>

      <form id="event-form" class="stack" hidden novalidate>
        <div id="duplicate-warning" class="notice notice-warn" hidden>
          This event page is already in Parbin as an event or suggestion.
        </div>

        <img id="image-preview" class="preview" alt="" hidden />

        <label class="field">
          <span>Title</span>
          <input id="title" type="text" maxlength="500" required />
        </label>

        <div class="grid-2">
          <label class="field">
            <span>Starts</span>
            <input id="starts-at" type="datetime-local" required />
          </label>
          <label class="field">
            <span>Ends</span>
            <input id="ends-at" type="datetime-local" required />
          </label>
        </div>
        <p id="timezone-hint" class="hint"></p>

        <label class="field">
          <span>Location</span>
          <input id="location" type="text" maxlength="2000" />
        </label>

        <label class="field">
          <span>Image URL</span>
          <input id="image" type="url" maxlength="2000" />
        </label>

        <label class="field">
          <span>Description</span>
          <textarea id="description" rows="6" maxlength="8000"></textarea>
        </label>

        <div class="field">
          <span>Tags <small id="tag-count" class="hint"></small></span>
          <div id="tag-list" class="chips"></div>
          <input id="tag-input" type="text" list="tag-options" placeholder="Add a catalog tag…" autocomplete="off" />
          <datalist id="tag-options"></datalist>
          <p id="tag-hint" class="hint"></p>
        </div>

        <p class="hint source">Source: <a id="source-link" target="_blank" rel="noreferrer"></a></p>

        <div id="form-error" class="notice notice-error" role="alert" hidden></div>
        <button id="submit" type="submit" class="button button-primary">Send suggestion</button>
      </form>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
